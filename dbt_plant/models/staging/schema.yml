version: 2

models:
  - name: stg_raw_readings
    description: >
      One row per sensor reading, cleaned and type-cast from raw_readings.
      Same grain as the source table -- no filtering, no reshaping yet.
    columns:
      - name: raw_reading_id
        description: Primary key from raw_readings.id.
        tests:
          - unique
          - not_null
      - name: device_id
        description: The device that produced this reading.
        tests:
          - not_null
      - name: zone
        description: The zone this reading was recorded in.
        tests:
          - not_null
      - name: reading_type
        description: One of temperature, pressure, vibration, flow.
        tests:
          - not_null
      - name: value
        description: The numeric reading value (may be null if malformed).
      - name: unit
        description: Unit of measurement for this reading.
      - name: reading_ts
        description: When the reading was taken, per the device.
        tests:
          - not_null
      - name: ingested_at
        description: When this reading was written into raw_readings.
      - name: quality_flag
        description: ok, missing_field, malformed_value, out_of_range, or unparseable.
        tests:
          - accepted_values:
              values: ['ok', 'missing_field', 'malformed_value', 'out_of_range', 'unparseable']
