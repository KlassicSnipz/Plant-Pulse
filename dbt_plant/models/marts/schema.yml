version: 2

models:
  - name: dim_device
    description: One row per physical device.
    columns:
      - name: device_key
        description: Surrogate key, generated by row_number().
        tests:
          - unique
          - not_null
      - name: device_id
        description: The device's natural identifier, e.g. "pump-01".
        tests:
          - unique
          - not_null

  - name: dim_zone
    description: One row per plant zone.
    columns:
      - name: zone_key
        tests:
          - unique
          - not_null
      - name: zone_name
        tests:
          - unique
          - not_null

  - name: dim_reading
    description: One row per reading type (temperature, pressure, vibration, flow).
    columns:
      - name: reading_key
        tests:
          - unique
          - not_null
      - name: reading_type
        tests:
          - unique
          - not_null

  - name: dim_quality
    description: One row per quality_flag value.
    columns:
      - name: quality_key
        tests:
          - unique
          - not_null
      - name: quality_flag
        tests:
          - unique
          - not_null

  - name: fact_readings
    description: One row per sensor reading, at the same grain as raw_readings.
    columns:
      - name: id
        description: Primary key, copied from raw_readings.id.
        tests:
          - unique
          - not_null
      - name: device_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_device')
              field: device_key
      - name: zone_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_zone')
              field: zone_key
      - name: reading_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_reading')
              field: reading_key
      - name: quality_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_quality')
              field: quality_key
